<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة تحكم التطبيقات والدروس</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root {
  --bg: #f3f6f9; --card: #fff; --ink: #1b2a35; --mute: #8a96a0; --line: #e1e7ec; --brand: #2a6289;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e151b; --card: #16202a; --ink: #e8eef2; --mute: #74828d; --line: #233340; --brand: #6fb1dd;
  }
}
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Tajawal", system-ui, sans-serif; line-height: 1.6;
  padding: 20px;
}
.container {
  max-width: 600px; margin: 0 auto;
}
h1 {
  font-size: 1.4rem; font-weight: 800; color: var(--brand); margin-bottom: 5px;
}
p.sub {
  color: var(--mute); font-size: 0.9rem; margin-bottom: 20px;
}
.app-card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; padding: 16px; margin-bottom: 12px;
  display: flex; justify-content: space-between; align-items: center;
}
.app-info h3 {
  margin: 0 0 5px 0; font-size: 1.05rem;
}
.app-info p {
  margin: 0; color: var(--mute); font-size: 0.85rem;
}
.btn-group {
  display: flex; gap: 8px;
}
button, a.btn {
  font-family: inherit; font-weight: 700; font-size: 0.85rem;
  padding: 8px 14px; border-radius: 8px; border: 0;
  background: var(--brand); color: #fff; text-decoration: none;
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
}
button.share-btn {
  background: transparent; border: 1px solid var(--line); color: var(--ink);
}
</style>
</head>
<body>

<div class="container">
  <h1>لوحة تطبيقاتي</h1>
  <p class="sub">اختر التطبيق أو الدرس للفتح أو المشاركة المباشرة</p>

  <!-- قائمة التطبيقات والدروس -->
  <div id="apps-list">
    <!-- مثال لتطبيق/درس -->
    <div class="app-card">
      <div class="app-info">
        <h3>دروس يوم الاثنين</h3>
        <p>عرض محتوى ودروس يوم الإثنين التفاعلية</p>
      </div>
      <div class="btn-group">
        <a href="./apps/monday/index.html" class="btn">فتح الدرس 🚀</a>
        <button class="share-btn" onclick="shareApp('./apps/monday/index.html')">نسخ الرابط</button>
      </div>
    </div>
  </div>
</div>

<script>
function shareApp(path) {
  // يولد الرابط الحقيقي والنظيف بناءً على عنوان السيرفر الحالي
  const fullUrl = new URL(path, window.location.href).href;
  
  if (navigator.clipboard) {
    navigator.clipboard.writeText(fullUrl).then(() => {
      alert("تم نسخ الرابط الحقيقي بنجاح:\n" + fullUrl);
    }).catch(err => {
      prompt("انسخ الرابط يدوياً:", fullUrl);
    });
  } else {
    prompt("انسخ الرابط يدوياً:", fullUrl);
  }
}
</script>

</body>
</html>

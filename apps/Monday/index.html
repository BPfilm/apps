<!doctype html>
<html lang="ar" dir="rtl">
  
 
<head>
    <!-- عنوان الصفحة الذي سيظهر في الواتساب -->
    <meta property="og:title" content="عنوان الموقع أو الصفحة" />
    
    <!-- وصف قصير يظهر تحت العنوان -->
    <meta property="og:description" content="مجموعة درة مارينا." />
    
    <!-- رابط الصورة التي تريد أن تظهر في المعاينة (يُفضل أن تكون رابط مباشر للصورة بصيغة PNG أو JPG) -->
    <meta property="og:image" content="https://bpfilm.github.io/apps/apps/Monday/Logo.png" />
    
    <!-- رابط الصفحة نفسها -->
    <meta property="og:url" content="https://bpfilm.github.io/apps/apps/Monday/index.html" />
    
    <meta property="og:type" content="website" />
  
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جدول دروس واستضافة يوم الإثنين</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#f3f6f9;--card:#fff;--ink:#1b2a35;--mute:#8a96a0;--line:#e1e7ec;--brand:#2a6289;--hero:#b45309;--heroink:#fff;--soft:#fff1d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e151b;--card:#16202a;--ink:#e8eef2;--mute:#74828d;--line:#233340;--brand:#6fb1dd;--hero:#f5a65b;--heroink:#1b1206;--soft:#33260f}}
:root[data-theme="dark"]{--bg:#0e151b;--card:#16202a;--ink:#e8eef2;--mute:#74828d;--line:#233340;--brand:#6fb1dd;--hero:#f5a65b;--heroink:#1b1206;--soft:#33260f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,"Segoe UI",Tahoma,sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:1.25rem;font-weight:800;margin:6px 0 2px;color:var(--brand)}
.sub{color:var(--mute);font-size:.85rem;margin:0 0 12px}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand);border-radius:99px}
.pl{display:flex;justify-content:space-between;color:var(--mute);font-size:.8rem;margin:6px 0 16px}
.hero{background:var(--hero);color:var(--heroink);border-radius:18px;padding:18px 18px 16px;margin-bottom:18px}
.hero .lab{font-size:.85rem;font-weight:700;opacity:.9}
.hero .big{font-size:1.7rem;font-weight:800;line-height:1.3;margin:2px 0}
.hero .rel{display:inline-block;background:rgba(255,255,255,.22);border-radius:99px;padding:1px 12px;font-size:.85rem;font-weight:700;margin-bottom:10px}
.hero .r{display:flex;align-items:center;gap:8px;font-size:1rem;margin-top:8px}.hero .r b{opacity:.85;font-weight:500;font-size:.85rem;white-space:nowrap}.hero .ic{flex:none;width:38px;height:30px;border-radius:15px;background:rgba(255,255,255,.2);display:grid;place-items:center}.hero .ic svg{width:30px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hero .note{margin-top:10px;font-size:.88rem;opacity:.9;border-top:1px solid rgba(255,255,255,.3);padding-top:8px}
.tools{display:flex;gap:8px;margin-bottom:14px}
.tools input{flex:1;min-width:0;font:inherit;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.tools button{font:inherit;font-weight:700;padding:10px 16px;border-radius:12px;border:0;background:var(--brand);color:var(--bg);cursor:pointer}
.hrow{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px}h2{font-size:.95rem;font-weight:700;color:var(--mute);margin:0}.pb{font:inherit;font-size:.85rem;font-weight:700;color:var(--brand);background:none;border:0;padding:4px 2px;cursor:pointer;display:flex;align-items:center;gap:4px}.pb svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}.pb[aria-expanded="true"] svg{transform:rotate(180deg)}.pw{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s}.pw.open{grid-template-rows:1fr}.pw>div{overflow:hidden;min-height:0}@media (prefers-reduced-motion:reduce){.pw,.pb svg{transition:none}}
.c{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--hero);display:grid;place-items:center;font-weight:800;font-size:.95rem}
.dt{font-weight:700}.row{font-size:.95rem}.k{color:var(--mute);font-size:.8rem;margin-inline-end:6px}
.note{color:var(--mute);font-size:.82rem;margin-top:2px}
.past{padding:8px 12px;box-shadow:none;background:transparent}
.past .n{width:26px;height:26px;font-size:.75rem;background:var(--line);color:var(--mute)}
.past .dt,.past .row{color:var(--mute);font-size:.82rem;font-weight:500}
.past .k{font-size:.7rem}
details>summary{cursor:pointer;color:var(--mute);font-weight:700;font-size:.95rem;padding:6px 2px;margin-top:14px}
.empty{color:var(--mute);text-align:center;padding:20px}
footer{color:var(--mute);font-size:.75rem;text-align:center;margin-top:24px}
</style>
</head>
<body>
<main>
<h1>جدول دروس واستضافة يوم الإثنين</h1>
<p class="sub">مساء كل إثنين</p>
<div class="prog"><i id="bar"></i></div>
<div class="pl"><span id="done"></span><span id="left"></span></div>
<div id="hero"></div>
<div class="tools"><input id="q" type="search" placeholder="ابحث عن اسم أو تاريخ" aria-label="بحث"><button id="share" hidden>مشاركة</button></div>
<div class="hrow"><h2 id="uh">الجلسات المقبلة</h2><button id="pb" class="pb" aria-expanded="false" hidden><span id="ps"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6 -6l6 6"/></svg></button></div>
<div id="pw" class="pw"><div id="past"></div></div>
<div id="up"></div>
<footer>البيانات حتى 20 أكتوبر 2026</footer>
</main>
<script>
const S=[[1,"2026-08-03","جلال",["رياض","محمد شعبان"],""],[2,"2026-08-10","أبو بسام",["الحايكي","سيد بدر"],"الاستضافة 11 أغسطس"],[3,"2026-08-17","جلال",["حسين العلي","محمد المطوع"],"الشيخ أبو غدير"],[4,"2026-08-24","شعبان",["عبد الجليل","حسن مال الله"],"الشيخ أبو غدير"],[5,"2026-08-31","رياض",["صادق","جلال"],"علي العالي"],[6,"2026-09-14","سيد كاظم",["سيد بدر","عبد الحميد فردان"],"الاستضافة: س. كاظم بدلاً من س. بدر"],[7,"2026-09-21","العسكري",["علوي الشبركة","سيد بدر"],"الاستضافة: العسكري بدلاً من صادق"],[8,"2026-09-28","س بدر",["سيد كاظم","حسين العلي"],"الاستضافة: س. بدر بدلاً من عبد الجليل"],[9,"2026-10-05","عبد الجليل",["علي العالي","الحايكي"],"الاستضافة: عبد الجليل بدلاً من أبو بسام"],[10,"2026-10-12","عبد الحميد",["علي العسكري","محمد شعبان"],""],[11,"2026-10-19","جلال",["علي بحر","رياض"],""],[12,"2026-10-26","شعبان",["محمد المطوع","عبد الجليل"],""],[13,"2026-11-02","رياض",["حسن مال الله","صادق"],""],[14,"2026-11-09","الحايكي",["جلال","سيد بدر"],""],[15,"2026-11-16","س كاظم",["عبد الحميد","علوي الشبركة"],""],[16,"2026-11-23","س بدر",["سيد كاظم","حسين العلي"],""],[17,"2026-11-30","عبد الجليل",["علي العالي","الحايكي"],""],[18,"2026-12-07","صادق",["علي العسكري","محمد شعبان"],""],[19,"2026-12-14","العسكري",["علي بحر","رياض"],""],[20,"2026-12-21","س بدر",["محمد المطوع","عبد الجليل"],""],[21,"2026-12-28","عبد الجليل",["حسن مال الله","صادق"],""],[22,"2027-01-04","عبد الحميد",["جلال","سيد بدر"],""],[23,"2027-01-11","جلال",["عبد الحميد","علوي الشبركة"],""],[24,"2027-01-18","شعبان",["سيد كاظم","حسين العلي"],""],[25,"2027-01-25","رياض",["علي العالي","الحايكي"],""],[26,"2027-02-01","الحايكي",["علي العسكري","محمد شعبان"],""],[27,"2027-02-08","س كاظم",["علي بحر","رياض"],""],[28,"2027-02-15","س بدر",["محمد المطوع","عبد الجليل"],""],[29,"2027-02-22","عبد الجليل",["حسن مال الله","صادق"],""],[30,"2027-03-01","صادق",["جلال","سيد بدر"],""]];
const today=new Date();today.setHours(0,0,0,0);
const fmt=new Intl.DateTimeFormat("ar-u-nu-latn",{weekday:"long",day:"numeric",month:"long"});
const R=S.map(([n,s,h,l,note])=>{const[y,m,d]=s.split("-");return{n,d:new Date(+y,m-1,+d),h,l,note}});
const ni=R.findIndex(r=>r.d>=today);
const rel=r=>{const k=Math.round((r.d-today)/864e5);return k===0?"اليوم":k===1?"غدًا":k===2?"بعد يومين":k<=10?"بعد "+k+" أيام":"بعد "+k+" يومًا"};
const txt=r=>fmt.format(r.d)+" "+r.h+" "+r.l.join(" ")+" "+r.note;
const card=(r,c)=>'<article class="c '+c+'"><div class="n">'+r.n+'</div><div><div class="dt">'+fmt.format(r.d)+'</div><div class="row"><span class="k">المستضيف</span>'+r.h+'</div><div class="row"><span class="k">المحاضرون</span>'+r.l.join(" • ")+'</div>'+(r.note?'<div class="note">'+r.note+'</div>':'')+'</article>'.replace('</article>','')+'</div></article>';
const $=id=>document.getElementById(id);
const HOME='<svg viewBox="0 0 24 24" style="width:20px;height:20px" aria-hidden="true"><path d="M5 12l-2 0l9 -9l9 9l-2 0"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7"/><path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6"/></svg>';
const TALK='<svg viewBox="0 0 34 24" aria-hidden="true"><circle cx="25" cy="8" r="4.2"/><path d="M17.5 22c0-4.2 3.2-7 7.5-7s7.5 2.8 7.5 7"/><path d="M16 8q-2 2.5 0 5"/><path d="M12 5.5q-4 5.5 0 10.5"/></svg>';
const done=ni===-1?R.length:ni;
$("bar").style.width=(done/R.length*100)+"%";
$("done").textContent="تمت "+done+" من "+R.length;
$("left").textContent="المتبقي "+(R.length-done);
if(ni>-1){const r=R[ni];$("hero").innerHTML='<section class="hero"><div class="lab">'+(r.d.getTime()===today.getTime()?"جلسة اليوم":"الجلسة القادمة")+' • رقم '+r.n+'</div><div class="big">'+fmt.format(r.d)+'</div><span class="rel">'+rel(r)+'</span><div class="r"><span class="ic">'+HOME+'</span><b>المستضيف</b><span>'+r.h+'</span></div><div class="r"><span class="ic">'+TALK+'</span><b>المحاضرون</b><span>'+r.l.join(" • ")+'</span></div>'+(r.note?'<div class="note">'+r.note+'</div>':'')+'</section>'}
else $("hero").innerHTML='<section class="hero"><div class="big">انتهت جميع الجلسات</div></section>';
function render(){
const q=$("q").value.trim();
const f=r=>!q||txt(r).includes(q);
const up=R.filter((r,i)=>(ni===-1?false:i>ni)&&f(r));
const pa=R.filter((r,i)=>(ni===-1?true:i<ni)&&f(r));
$("up").innerHTML=up.length?up.map(r=>card(r,"")).join(""):'<div class="empty">لا توجد نتائج</div>';
$("past").innerHTML=pa.map(r=>card(r,"past")).join("");
$("ps").textContent="الجلسات السابقة ("+pa.length+")";
$("pb").hidden=!pa.length;
if(q&&pa.length)setPast(true);
}
function setPast(o){$("pw").classList.toggle("open",o);$("pb").setAttribute("aria-expanded",String(o))}
$("pb").onclick=()=>setPast(!$("pw").classList.contains("open"));
$("q").addEventListener("input",render);
render();
if(navigator.share||navigator.clipboard){$("share").hidden=false;$("share").onclick=async()=>{try{if(navigator.share){await navigator.share({title:document.title,url:location.href})}else{await navigator.clipboard.writeText(location.href);$("share").textContent="تم النسخ"}}catch(e){}}}
</script>
</body>
</html>

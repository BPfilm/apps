<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ميزان المجاهدة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap">
<style>
:root{--bg:#eef3f1;--ink:#12302f;--mut:#51706d;--card:#fff;--line:#cfdcd8;--good:#1c7a5c;--bad:#a8432f;--gold:#9a7418;--btn:#e3ece9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1f21;--ink:#e6f0ed;--mut:#93b0ab;--card:#132b2d;--line:#24474a;--good:#52c29a;--bad:#e08a6f;--gold:#d9b25a;--btn:#193638}}
:root[data-theme="dark"]{--bg:#0c1f21;--ink:#e6f0ed;--mut:#93b0ab;--card:#132b2d;--line:#24474a;--good:#52c29a;--bad:#e08a6f;--gold:#d9b25a;--btn:#193638}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,"Segoe UI",Tahoma,sans-serif;line-height:1.5;font-size:15px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:640px;margin:0 auto;padding:0 12px 24px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);padding:8px 0 6px;border-bottom:1px solid var(--line)}
h1{font-size:1.15rem;font-weight:800;margin:0 0 4px}
.hud{display:grid;grid-template-columns:132px 1fr;gap:10px;align-items:center}
svg{width:100%;height:auto;display:block}
.beam,.pole{stroke:var(--ink)}
.m{margin-bottom:5px}
.m b{display:flex;justify-content:space-between;font-size:.82rem}
.bar{height:8px;border-radius:5px;background:var(--btn);overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;width:0;transition:width .4s}
#bw{background:var(--good)}#bs{background:var(--bad)}#ba{background:var(--gold)}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.82rem}
.badge{padding:1px 10px;border-radius:14px;font-weight:700;border:2px solid var(--gold);color:var(--gold)}
.badge.broken{border-color:var(--bad);color:var(--bad)}
.badge.steady{border-color:var(--good);color:var(--good)}
.envy{color:var(--bad);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:8px}
h2{font-size:.85rem;margin:6px 0 4px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
button{font:inherit;font-size:.85rem;font-weight:700;padding:6px 4px;border-radius:9px;border:1px solid var(--line);background:var(--btn);color:var(--ink);cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:active:not(:disabled){transform:scale(.97)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.g{border-inline-start:4px solid var(--good)}.b{border-inline-start:4px solid var(--bad)}.t{border-inline-start:4px solid var(--gold)}
ul{list-style:none;margin:0;padding:0;font-size:.85rem}
li{padding:3px 0;border-bottom:1px solid var(--line);color:var(--mut)}
li:first-child{color:var(--ink);font-weight:700}
.note{margin-top:10px;font-size:.78rem;color:var(--mut)}
.tl{position:relative;height:96px;overflow:hidden;margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.ticks{position:absolute;left:0;right:0;bottom:8px;height:6px;background:repeating-linear-gradient(90deg,var(--mut) 0 2px,transparent 2px 12px);opacity:.45;transition:background-position .6s ease}
.ground{position:absolute;left:0;right:0;bottom:13px;height:2px;background:var(--line)}
.world{position:absolute;top:0;right:30%;width:0;height:100%;transition:transform .6s ease}
.mk{position:absolute;top:6px;font-size:.72rem;color:var(--mut);transform:translateX(50%);white-space:nowrap}
.mk.life{color:var(--bad);font-weight:700}
.char{position:absolute;right:30%;margin-right:-27px;bottom:12px;width:54px;height:70px}
.char svg{width:100%;height:100%;display:block;overflow:visible}
.walk{animation:wk var(--wd,.5s) ease-in-out 3}
.hop{animation:hp .85s ease-out}
@keyframes wk{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes hp{0%{transform:translateY(0)}45%{transform:translateY(-38px)}100%{transform:translateY(0)}}
#end{position:fixed;inset:0;z-index:30;display:none;overflow:hidden;background:#000}
#end.show{display:block}
#end .scene{position:absolute;inset:0;width:100%;height:100%;transform-origin:50% 45%;animation:zm 6s ease-in forwards}
@keyframes zm{from{transform:scale(1)}to{transform:scale(3.2)}}
#end .cap{position:absolute;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));text-align:center;color:#fff;text-shadow:0 2px 8px #000;padding:0 16px;opacity:0;animation:fi 1.2s 4.5s forwards}
#end h3{font-size:2rem;margin:0}
#end p{margin:4px 0 10px}
@keyframes fi{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.bar i,.world,.ticks{transition:none}button:active{transform:none}.walk,.hop,#end .scene{animation:none}}

main{padding:0 8px 8px}
header{padding:4px 0}
h1{font-size:1rem;margin:0 0 2px;display:flex;justify-content:space-between;align-items:center}
.rs{display:inline;padding:0 6px;font-size:1.1rem;border:0;background:none;min-height:0}
.hud{grid-template-columns:92px 1fr;gap:8px}
.m{margin-bottom:3px}.m b{font-size:.74rem}.bar{height:6px}
#bt{background:var(--mut)}
.tags{font-size:.74rem;gap:4px}
.tl{height:100px;margin-top:6px}
.card{margin-top:6px;padding:6px 8px}
h2{font-size:.72rem;margin:3px 0}
.grid{grid-template-columns:repeat(4,1fr);gap:5px}
button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 2px;font-size:.72rem;line-height:1.15;min-height:46px}
button i{font-style:normal;font-size:1.2rem;line-height:1}
ul{font-size:.78rem}li:nth-child(n+3){display:none}
.note{font-size:.66rem;margin:4px 0 0}
.char svg{transform:scale(var(--sc,1));transform-origin:50% 100%}
.walk.heavy{animation:st var(--wd) ease-in-out 2}
@keyframes st{0%{transform:scaleX(1)}35%{transform:scaleX(1.22) skewX(8deg)}65%{transform:scaleX(.94)}100%{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.walk.heavy{animation:none}}
@media (min-width:760px){main{max-width:920px;display:grid;grid-template-columns:1fr 1fr;column-gap:12px;align-items:start}header,.tl,.logc{grid-column:1}#acts{grid-column:2;grid-row:1/4}.note{grid-column:1/3}}
#trail{position:absolute;bottom:11px;width:0;height:0;opacity:0;border-radius:50% 50% 0 0/100% 100% 0 0;background:linear-gradient(#9bbd1f,#38490a);box-shadow:inset 0 2px 0 rgba(255,255,255,.35);transition:width .6s,height .6s,opacity .6s}
.el{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
h1 small{font-size:.75rem;color:var(--mut);font-weight:400}
#start{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
#start .box{max-width:340px;width:100%;text-align:center}
#start .big{font-size:3.2rem;line-height:1.2}
#start h2{font-size:1.5rem;margin:4px 0;color:var(--ink)}
#start p{color:var(--mut);margin:0 0 8px}
#nameIn{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:1.1rem;text-align:center;margin-bottom:10px}
#go{width:100%;flex-direction:row;gap:8px;font-size:1.1rem;min-height:48px;border-color:var(--gold)}
</style>
</head>
<body>
<main>
<header>
<h1><span>⚖️ ميزان المجاهدة <small id="nm"></small></span><span><button class="rs" id="mute" data-act="mute" aria-label="الصوت">🔊</button><button class="rs" data-act="reset" aria-label="ابدأ من جديد" title="ابدأ من جديد">🔁</button></span></h1>
<div class="hud">
<svg viewBox="0 0 300 200" role="img" aria-label="ميزان تتغير كفتاه">
<path class="pole" d="M150 40v140M105 182h90" stroke-width="6" stroke-linecap="round" fill="none"/>
<g id="dyn"></g><circle cx="150" cy="40" r="8" fill="var(--gold)"/>
</svg>
<div>
<div class="m"><b><span id="age"></span><span id="opp"></span></b><div class="bar"><i id="ba"></i></div></div>
<div class="m"><b><span>⏳ الوقت</span><span id="tm"></span></b><div class="bar"><i id="bt"></i></div></div>
<div class="m"><b><span>⚖️ ثقل الموازين</span><span id="vw"></span></b><div class="bar"><i id="bw"></i></div></div>
<div class="m"><b><span>🕸️ الشقاوة</span><span id="vs"></span></b><div class="bar"><i id="bs"></i></div></div>
<div class="tags"><span class="badge" id="badge"></span><span id="miss"></span><span class="envy" id="envy"></span></div>
</div>
</div>
</header>
<section class="tl" aria-label="خط الزمن"><div class="ticks" id="ticks"></div><div class="ground"></div><div class="world" id="world"></div><div id="trail"></div><div class="char" id="char"></div><svg id="elastic" class="el" aria-hidden="true"></svg></section>
<section class="card" id="acts"></section>
<div id="start"><div class="box"><div class="big">⚖️</div><h2>ميزان المجاهدة</h2><p>اكتب اسمك لتبدأ رحلتك</p><input id="nameIn" maxlength="20" placeholder="اسمك" autocomplete="off"><button id="go"><i>▶</i>ابدأ</button></div></div>
<div id="end"></div>
<section class="card logc"><ul id="log"></ul></section>
<p class="note">لعبة تعليمية مبسّطة؛ الحال فيها تقدير للمجاهدة لا حكمٌ على أحد، وميزان الآخرة لله وحده.</p>
</main>
<script>
const FN={envy:"الحسد",pride:"الأنانية والتكبر",desire:"الهوى",world:"تأثير المحيط",anger:"الغضب",greed:"الطمع"};
const D={good:["عمل صالح",10],sabr:["صبر",0],istighfar:["استغفار",8],tawba:["توبة",15],tazkiya:["تزكية",8],sadaqa:["صدقة",8],rahim:["صلة الرحم",6]};
const CURE=["istighfar","tawba","tazkiya"],REC=["istighfar","tawba","sabr"];
const BO={envy:{n:"وحش الحسد",s:"نار الحطب"},greed:{n:"وحش الحرص وشكاسة الخلق",s:"الاضطراب"},jah:{n:"وحش حب الجاه والعلو",s:"الإغراء"}};
let S,log,X=null,lastOff=0,lastAct="",shown=false,chKey="",NAME="",RAW="",started=false,muted=false,AC=null,anchors=[],elRaf=0;
function init(){
  S={age:0,life:60,opp:0,intro:true,ia:0,nx:.5,t:YEAR_SEC,w:100,f:{envy:0,pride:0,desire:0,world:0,anger:0,greed:0},envy:false,ei:0,streak:0,broken:false,shield:false,sad:false,rah:false,missed:0,over:false};
  X=null;shown=false;lastOff=0;chKey="";anchors=[];document.getElementById("end").className="";log=["وُلدتَ يا "+NAME+" على الفطرة نقيًا: تمشي بخطواتك الأولى حتى سنّ الخامسة عشرة، وهناك تبدأ الأمانة."];
}
const wret=()=>Object.values(S.f).reduce((a,b)=>a+b,0);
const say=m=>{log.unshift(m);if(log.length>4)log.pop();};
function reduce(n,fl){
  if(fl){const c=Math.min(S.f[fl],n);S.f[fl]-=c;n-=c;}
  Object.keys(S.f).sort((a,b)=>S.f[b]-S.f[a]).forEach(k=>{if(n>0){const c=Math.min(S.f[k],n);S.f[k]-=c;n-=c;}});
}
function cure(){
  if(!S.envy)return;
  S.streak++;S.ei=Math.max(0,S.ei-.5);
  if(S.streak>=3||S.f.envy<=0){S.envy=false;S.ei=0;S.streak=0;say("شفاء من الحسد: انطفأت النار.");}
}
function upd(){
  const w=wret();
  if(!S.broken&&(w>=100||(S.w===0&&w>50))){S.broken=true;say("انكسار روحي: غلبت الشقاوة، فضعف أثر الأعمال العادية.");}
  else if(S.broken&&w<60&&S.w>0){S.broken=false;say("تعافٍ: خرجتَ من الانكسار، والرجوع مفتوح.");}
}
function deed(k){
  if(S.over||S.opp<1)return;
  if(k==="sadaqa"&&S.sad||k==="rahim"&&S.rah)return;
  S.opp--;let m=1;const [n,v]=D[k];sfx(({tawba:"tawba",istighfar:"tawba",tazkiya:"tawba",sadaqa:"sadaqa",sabr:"sabr"})[k]||"good");
  if(S.envy&&!CURE.includes(k))m*=.4;
  if(S.broken&&!REC.includes(k))m*=.6;
  const val=v*m;S.w+=val;
  reduce(val*.5*(k==="istighfar"||k==="tawba"?1.5:1));
  if(k==="sabr"){S.shield=true;reduce(4);say("صبر: درع يخفّف أثر المحيط في العام القادم.");}
  else if(k==="sadaqa"){S.sad=true;S.life=Math.min(80,S.life+2);say("صدقة: +"+val.toFixed(1)+" وزيد في أجلك سنتين.");}
  else if(k==="rahim"){S.rah=true;S.life=Math.min(80,S.life+1);say("صلة الرحم: +"+val.toFixed(1)+" وبُورك لك في عمرك سنة.");}
  else say(n+": +"+val.toFixed(1)+(S.envy&&!CURE.includes(k)?" (نار الحسد استنزفت جزءًا)":"")+".");
  if(CURE.includes(k))cure();
  upd();
}
function year(){
  if(S.over||S.intro)return;sfx("year");
  if(S.opp>0){S.missed+=S.opp;S.w=Math.max(0,S.w-S.opp);say("فاتتك "+S.opp+" فرصة هذا العام ولا تعود.");}
  const P=["world","greed","anger","pride","desire"],k=Math.random()<.12?"envy":P[Math.random()*5|0];
  let a=4+Math.floor((S.age-15)/10);
  if(S.shield){a/=2;S.shield=false;}
  S.f[k]+=a;S.w=Math.max(0,S.w-2);setTimeout(()=>sfx(k==="envy"?"envy":"flaw"),350);
  if(k==="envy"){S.envy=true;S.ei=Math.min(3,S.ei+.5);S.streak=0;}
  if(S.envy)S.w=Math.max(0,S.w-2*S.ei);
  S.f.anger=Math.max(0,S.f.anger-3);
  S.age++;S.opp=3;S.sad=S.rah=false;S.t=YEAR_SEC;
  say("مرّ عام: تسلّل إلى نفسك "+FN[k]+" (+"+a.toFixed(1)+") وتآكلت فطرتك قليلًا.");
  upd();
  if(S.age>=S.life){
    S.over=true;X=null;
    say("انتهى العمر يا "+NAME+": الموازين "+S.w.toFixed(0)+" مقابل شقاوة "+wret().toFixed(0)+"، وفاتتك "+S.missed+" فرصة. ﴿لَعَلِّي أَعْمَلُ صَالِحًا فِيمَا تَرَكْتُ﴾");
  }
}
function fix(){
  if(S.over||S.opp<1)return;
  const top=Object.keys(S.f).sort((a,b)=>S.f[b]-S.f[a])[0];
  if(S.f[top]<=0){say("لا عيب ظاهرًا لتتداركه الآن.");return;}
  S.opp--;reduce(10,top);S.w+=2;if(top==="envy")cure();
  say("تدارك: عالجتَ "+FN[top]+".");upd();
}
function fight(k){
  if(S.over||S.opp<1||X)return;
  sfx("boss");S.opp--;X={k,hp:100,shield:false,lock:null,cancel:false,cd:{tawba:0,dhikr:0}};
  say("ظهر "+BO[k].n+" ومعه «"+BO[k].s+"».");
}
function bossTurn(){
  const b=BO[X.k];X.lock=null;sfx(X.cancel||(X.shield&&X.k!=="greed")?"snap":(X.k==="envy"?"envy":"hit"));
  if(X.cancel){X.cancel=false;say("كُشف الفخ فبطلت ضربة «"+b.s+"».");return;}
  if(X.shield&&X.k!=="greed"){X.shield=false;X.hp-=8;say("درع الصبر صدّ «"+b.s+"» وضعفت الآفة.");return;}
  if(X.k==="envy"){const d=Math.max(5,S.w*.12);S.w=Math.max(0,S.w-d);S.f.envy+=5;say("«"+b.s+"»: التهمت "+d.toFixed(1)+" من حسناتك.");}
  else if(X.k==="greed"){X.shield=false;S.f.greed+=10;X.lock=["tawba","dhikr"][Math.random()*2|0];say("«"+b.s+"»: سقط الدرع وتعطّلت قدرة.");}
  else{S.f.pride+=8;say("«"+b.s+"»: لمعت أمامك مكاسب الدنيا وبنيانك يتآكل.");}
}
function skill(k){
  if(!X)return;
  if(k==="flee"){X=null;say("انسحبتَ من المواجهة.");return;}
  if(X.lock===k||X.cd[k]>0)return;sfx({shield:"sabr",tawba:"tawba",dhikr:"good",offer:"flaw"}[k]);
  if(k==="shield"){X.shield=true;say("درع الصبر ﴿جَزَيْتُهُمُ الْيَوْمَ بِمَا صَبَرُوا﴾: ثبت فؤادك.");}
  else if(k==="tawba"){reduce(25);S.w+=5;X.hp-=10;X.cd.tawba=3;cure();say("ترياق التوبة: تداركتَ أخطاءك.");}
  else if(k==="dhikr"){X.hp-=25;S.w+=6;X.cancel=true;X.cd.dhikr=2;say("الذكر والتدبر: زاد يقينك وانكشف الفخ.");}
  else if(k==="offer"){S.w+=25;S.f.desire+=15;S.f.pride+=10;X.hp=Math.min(100,X.hp+15);say("قبلتَ العرض: ربح سريع وبنيان متآكل.");}
  if(X.hp<=0){sfx("win");S.w+=15;reduce(15);X=null;say("انتصرتَ ﴿فَمَنْ ثَقُلَتْ مَوَازِينُهُ﴾: زاد ثقل موازينك.");upd();return;}
  bossTurn();upd();
  if(S.broken||S.w<=0){sfx("lose");X=null;say("هُزمتَ في الجولة ﴿غَلَبَتْ عَلَيْنَا شِقْوَتُنَا﴾. أعمال التعافي تعيدك إلى المجاهدة.");return;}
  for(const c in X.cd)if(X.cd[c]>0)X.cd[c]--;
}
const YEAR_SEC=14;
const IC={good:"🌱",sabr:"🛡️",istighfar:"🤲",tawba:"🔄",tazkiya:"✨",sadaqa:"🪙",rahim:"👨‍👩‍👧",fix:"🛠️",envy:"🔥",greed:"🤑",jah:"👑",shield:"🛡️",dhikr:"📿",offer:"🎁",flee:"🏃",year:"⏳"};
const SH={envy:"الحسد",greed:"الحرص",jah:"الجاه"};
function rot(a,x,y,p,n,ph){return `<animateTransform attributeName="transform" type="rotate" values="${a} ${x} ${y};${-a} ${x} ${y};${a} ${x} ${y}" dur="${p.toFixed(2)}s" repeatCount="${n}"${ph?` begin="-${(p/2).toFixed(2)}s"`:""}/>`;}
function babySVG(at,mv){
  const sk="#ffd9a0",on="#fff8e7",p=mv?mv.p:1,n=mv?mv.n:1;
  const limb=(x,y,len,w,a,ph,base,c)=>`<g transform="rotate(${base} ${x} ${y})"><g>${mv?rot(a,x,y,p,n,ph):""}<path d="M${x} ${y}V${y+len}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/></g></g>`;
  const wob=mv?`<animateTransform attributeName="transform" type="rotate" values="-3 30 76;3 30 76;-3 30 76" dur="${(p*2).toFixed(2)}s" repeatCount="${n==="indefinite"?n:Math.ceil(n/2)}"/>`:"";
  return `<svg ${at||""}viewBox="0 0 60 80"><g>${wob}`+
   limb(25,60,15,5,16,0,0,sk)+limb(35,60,15,5,16,1,0,sk)+
   `<ellipse cx="30" cy="51" rx="9.5" ry="10.5" fill="${on}" stroke="#ead9b4" stroke-width=".8"/>`+
   limb(21,45,12,4,12,1,32,sk)+limb(39,45,12,4,12,0,-32,sk)+
   `<circle cx="30" cy="29" r="12" fill="${sk}"/><path d="M27 18q3-6 6 0q-3-2-6 0Z" fill="#7a4a1c"/>`+
   `<circle cx="26" cy="29" r="2" fill="#12302f"/><circle cx="34" cy="29" r="2" fill="#12302f"/><circle cx="26.600" cy="28.300" r=".6" fill="#fff"/><circle cx="34.600" cy="28.300" r=".6" fill="#fff"/>`+

    S.ia+=.1;
    if(S.ia>=S.nx){S.ia=0;S.nx=.35+Math.random()*.5;S.age++;sfx("step");
      if(S.age>=15){S.intro=false;S.opp=3;S.t=YEAR_SEC;say("بلغتَ سنّ التكليف: بدأت الأمانة، وكل لحظة تردّد تُحسب عليك.");}
      render();}
    return;
  }
  if(S.over||X)return;
  S.t-=.1;
  if(S.t<=0){lastAct="year";year();if(!S.over)say("⏳ تردّدتَ فمضى العام وحده.");render();}
  else{timerUI();if(S.t<4&&Math.ceil(S.t)!==Math.ceil(S.t+.1))sfx("tick");}
},100);
</script>

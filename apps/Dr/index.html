<style>

html{background:var(--bg,#faf6ec)}
html,body{margin:0;height:100%;height:100dvh}

.bar{width:100%;height:calc(var(--u)*1.2);border-radius:6px;background:var(--ln);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--ac));transition:width .6s}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:calc(var(--u));margin-top:calc(var(--u))}
button{font:inherit;color:var(--tx);cursor:pointer}
.opt{background:transparent;border:2px solid var(--ln);border-radius:calc(var(--u)*1.8);padding:calc(var(--u)*1.1) calc(var(--u));min-height:calc(var(--u)*5.6);font-size:calc(var(--u)*2.2);font-weight:500;transition:transform .15s,border-color .15s}

.opt.ok{background:var(--ok);border-color:var(--okb)}.opt.bad{background:var(--bad);border-color:var(--badb)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:calc(var(--u)*1.8);padding:calc(var(--u)*1.2) calc(var(--u)*3.2);font-weight:700;font-size:calc(var(--u)*2.2)}
:root[data-theme="dark"] .btn{color:#10251f}
.note{margin-top:calc(var(--u));padding:calc(var(--u)) calc(var(--u)*1.5);font-size:calc(var(--u)*2);border-radius:calc(var(--u)*1.5);background:var(--bg);border:1px dashed var(--gold);animation:rise .4s}

@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.tag{font-size:calc(var(--u)*1.9);color:var(--gold);font-weight:700}
.case{display:flex;gap:calc(var(--u)*1.2);align-items:center;margin:calc(var(--u)*.3) 0 calc(var(--u)*.8)}
.av{flex:none;width:calc(var(--u)*15);aspect-ratio:120/140;animation:bob 3s ease-in-out infinite}.av svg,.av img{width:100%;height:100%}
@keyframes bob{50%{transform:translateY(-5px)}}
.sc{font-size:calc(var(--u)*2.3);line-height:1.5;margin:calc(var(--u)*.5) 0}
.c{text-align:center}.mini{font-size:calc(var(--u)*2);color:var(--mut)}
ul{margin:8px 0 0;padding-inline-start:22px}
.sb{background:none;border:1px solid var(--ln);border-radius:20px;padding:2px 12px;font-size:calc(var(--u)*1.9);color:var(--mut)}
.ages{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u));margin-top:calc(var(--u))}.ages button:last-child{grid-column:1/-1}
.zones{display:flex;gap:calc(var(--u));margin-top:calc(var(--u))}.zones .opt{flex:1}.pen svg{width:100%;height:auto;max-height:38vh}.dots{font-size:calc(var(--u)*3);margin:0}
</style>
</head>

let o='<ellipse cx="45" cy="67" rx="5" ry="3" fill="#e08a7a" fill-opacity=".3"/><ellipse cx="75" cy="67" rx="5" ry="3" fill="#e08a7a" fill-opacity=".3"/><path d="M60 60q-3 5 1 6" fill="none" stroke="#a8764f" stroke-opacity=".6" stroke-width="1.6" stroke-linecap="round"/>';
if(e!=='closed')o+=`<circle cx="${ex[0]+1}" cy="57" r="1" fill="#fff"/><circle cx="${ex[1]+1}" cy="57" r="1" fill="#fff"/>`;
o+=g==='m'?'<path d="M60 100v38" stroke="#cfc6ad" stroke-width="1.6"/><circle cx="60" cy="108" r="1.4" fill="#cfc6ad"/><circle cx="60" cy="118" r="1.4" fill="#cfc6ad"/>':'<path d="M44 100q-2 20-4 38M76 100q2 20 4 38" fill="none" stroke="#2f4549" stroke-width="2"/>';
o+=`<circle cx="36" cy="122" r="5.5" fill="${sk}"/><circle cx="${calm?84:88}" cy="${calm?122:124}" r="5.5" fill="${sk}"/>`;
return s.replace('</svg>',o+'</svg>')}
function topbar(){return `<div class="top"><span>${S.scr==='play'?`حالة ${S.i+1} من ${S.cs.length}`:'طبيب القلوب'}</span><button class="sb" onclick="S.snd=!S.snd;tone(CL);R()">${S.snd?'🔊 الصوت':'🔇 الصوت'}</button></div><div class="heart">${heartSvg(S.p)}<div style="flex:1;display:flex;flex-direction:column;gap:4px"><div class="bar"><i style="width:${S.p}%"></i></div><span class="mini">نقاء القلب: ${Math.round(S.p)}%</span></div></div>`}
const fmt=ms=>{const s=Math.round(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const PA='موقف: بر الوالدين',PH='موقف: مساعدة الآخرين';
const W={
A:[['v','أمك تحتاج مساعدة في ترتيب البيت وأنت تلعب.','ماذا تفعل؟',['أتوقف عن اللعب وأساعدها بفرح','أقول: بعد قليل، ولا أفعل شيئًا','أتظاهر بالنوم','أطلب منها مالًا قبل أن أساعدها'],'من بر الوالدين مساعدتهما بفرح وطاعتهما في المعروف.',PA,2],['v','رأيت زميلك يبكي لأن قلمه ضاع.','ما التصرف الأنسب؟',['أعطيه قلمًا وأساعده','أضحك عليه','أتركه وأذهب','أقول: هذا ليس شأني'],'مساعدة المحتاج من أخلاق المسلم.',PH,3]],
B:[['v','والدك يطلب منك أن تترك الجوال وتساعده وأنت في وسط لعبة.','ما التصرف الأنسب؟',['أنهي اللعب فورًا وأخدمه بأدب','أقول: دقيقة، ثم أتأخر ساعة','أرد بصوت عالٍ لأنه قاطعني','أطلب من أخي أن يذهب بدلًا مني'],'البر يظهر في سرعة الاستجابة وحسن الأدب مع الوالدين.',PA,2],['v','زميل جديد في الصف لا يعرف أحدًا ويجلس وحده.','ما التصرف الأنسب؟',['أتعرف عليه وأعرّفه على الجميع','أتجاهله','أسخر من لهجته','أنتظر أن يتكلم هو أولًا'],'من مساعدة الآخرين أن تؤنس الغريب وتشعره بالقبول.',PH,3]],
C:[['v','تأخرت خارج البيت وأمك تتصل بك لتطمئن عليك.','ما التصرف الأنسب؟',['أرد بهدوء وأطمئنها وأعود في الوقت','أغلق الهاتف حتى لا أُحرج','أرد بانزعاج وأقول: لست طفلًا','أتجاهل الاتصال'],'من البر طمأنة الوالدين والرد عليهما بلين.',PA,2],['v','زميلك يتعثر في مادة وأنت متفوق فيها.','ما التصرف الأنسب؟',['أشرح له وأعطيه ملخصاتي','أخفي ملخصاتي عنه','أقول له إن الأمر سهل ولا يحتاج شرحًا','أنتظر رسوبه'],'بذل العلم والمساعدة من أجمل صور مساعدة الآخرين.',PH,3]],
D:[['v','والدك كبر ويحتاج مرافقة إلى المستشفى في موعد عمل مهم.','ما التصرف الأنسب؟',['أرتب وقتي وأرافقه وأتواصل مع العمل','أرسل سائقًا فقط وأنشغل','أقول: لا وقت عندي','أترك الأمر لإخوتي'],'برّ الوالدين في كبرهما يقدَّم على كثير من الأشغال.',PA,2],['v','جار لك فقد عمله ويتردد في طلب المساعدة.','ما التصرف الأنسب؟',['أعرض مساعدتي بلطف وأدله على فرصة','أتظاهر أني لا أعلم','أتحدث عن حاله في المجلس','أقرضه مع المنّ والأذى'],'المساعدة بلطف وستر تحفظ كرامة المحتاج.',PH,3]],
E:[['v','أمك كبيرة في السن وتكرر نفس الكلام.','ما التصرف الأنسب؟',['أصغي إليها بصبر وأخاطبها بلين','أقاطعها وأقول: قلتِ هذا من قبل','أتضجر وأنهي الحديث','أتركها لمن يهتم بها'],'الصبر والرفق بالوالدين عند الكبر من أعظم البر.',PA,2],['v','في الحي أرملة تحتاج من يقضي لها حاجاتها.','ما التصرف الأنسب؟',['أتفقد حالها وأقضي حاجتها بستر','أطلب منها أجرًا','أخبر الناس لأظهر فضلي','أترك ذلك للجمعيات فقط'],'قضاء الحاجات بستر أبعد عن الرياء وأحفظ لكرامة الناس.',PH,3]]};
function topbar(){return `<div class="top"><span>${S.scr==='play'?`المرحلة ${Math.floor(S.i/S.sz)+1} · حالة ${S.i+1} من ${S.cs.length}`:'طبيب القلوب'}</span>${S.scr==='play'?`<span>⏱ <b id="tm">${fmt(S.done?S.last:Date.now()-S.t0)}</b></span>`:''}<button class="sb" onclick="S.snd=!S.snd;tone(CL);R()">${S.snd?'🔊 الصوت':'🔇 الصوت'}</button></div><div class="heart">${heartSvg(S.p)}<div class="bar"><i style="width:${S.p}%"></i></div><span class="mini">نقاء القلب: ${Math.round(S.p)}%</span></div>`}
function start(g){const a=AG.find(x=>x[0]===g)||AG[2];S.age=a[0];S.cs=T[a[2]].concat(W[a[2]]);S.sz=Math.ceil(S.cs.length/3);S.pool=T[a[2]].map(c=>D[c[0]][0]);S.dk=a[2]==='A';S.scr='play';S.i=0;S.p=50;S.o=sh(S.cs.map((_,j)=>j));S.miss=[];S.ok=0;S.ok2=0;S.tms=[];S.st=0;S.done=false;S.opts=null;tone(CL);R()}
function pick(j){if(S.done)return;S.done=true;const cs=S.cs[S.o[S.i]],val=cs[0]==='v',d=val?null:D[cs[0]];const ok=val?S.opts[j]===cs[3][0]:(S.st===0?S.opts[j]===d[0]:S.opts[j]===d[3]);S.last=Date.now()-S.t0;S.tms.push(S.last);S.fb=ok;if(val){if(ok)S.ok2++}else if(S.st===0){if(ok)S.ok++;else S.miss.push(d[0])}S.sel=j;S.p=Math.max(0,Math.min(100,S.p+(ok?(val?5:S.st?4:6):-3)));tone(ok?OK:NO);R();const hh=document.getElementById('hs');if(hh)hh.classList.add(ok?'pulse':'shake')}
function next(){tone(CL);const cs=S.cs[S.o[S.i]];if(cs[0]!=='v'&&S.st===0){S.st=1;S.done=false;R();return}
S.st=0;S.done=false;S.i++;if(S.i>=S.cs.length){S.scr='end';tone(WIN)}else if(S.i%S.sz===0){S.pk={lv:S.i/S.sz,res:[],busy:false,out:null};S.scr='pen'}R()}
function shoot(z){const k=S.pk;if(k.busy||k.out)return;k.busy=true;tone(CL);const pr=[.35,.55][k.lv-1]||.6;let g=z;if(Math.random()>=pr)g=sh([0,1,2].filter(x=>x!==z))[0];const save=g===z,dx=[-75,0,75];const b=document.getElementById('bl'),kp=document.getElementById('kp');if(b)b.style.transform=`translate(${dx[z]}px,-70px)`;if(kp)kp.style.transform=`translateX(${dx[g]}px)`;
setTimeout(()=>{k.busy=false;k.res.push(!save);if(!save){k.out='goal';tone(WIN)}else{tone(NO);if(k.res.length>=3)k.out='fail'}R()},700)}
function penR(a){const k=S.pk,sc=1+.2*k.lv;
const svg=`<svg viewBox="0 0 300 190" aria-label="مرمى"><rect x="0" y="150" width="300" height="40" fill="#7cc5ae" fill-opacity=".25"/><rect x="30" y="28" width="240" height="122" fill="none" stroke="#c59a3d" stroke-width="5"/><path d="M30 58h240M30 88h240M30 118h240M70 28v122M110 28v122M150 28v122M190 28v122M230 28v122" stroke="#c59a3d" stroke-opacity=".35"/><g id="kp" style="transition:transform .5s"><g transform="translate(150 112) scale(${sc})"><circle cy="-30" r="12" fill="#e0b087"/><rect x="-14" y="-18" width="28" height="36" rx="8" fill="#3f8f7b"/><path d="M-14 -10l-16 10M14 -10l16 10" stroke="#e0b087" stroke-width="6" stroke-linecap="round"/><rect x="-10" y="16" width="8" height="18" fill="#23413b"/><rect x="2" y="16" width="8" height="18" fill="#23413b"/></g></g><circle id="bl" cx="150" cy="172" r="9" fill="#fff" stroke="#23413b" stroke-width="2" style="transition:transform .5s"/></svg>`;
const dots=[0,1,2].map(i=>k.res[i]===undefined?'⚪':k.res[i]?'✅':'❌').join(' ');
let ctl=`<div class="zones" dir="ltr"><button class="opt" onclick="shoot(0)">يسار</button><button class="opt" onclick="shoot(1)">وسط</button><button class="opt" onclick="shoot(2)">يمين</button></div>`;
if(k.out==='goal')ctl=`<div class="note">هدف! اجتزت الحارس، والمرحلة التالية أصعب.</div><div class="c" style="margin-top:14px"><button class="btn" onclick="S.scr='play';R()">المرحلة التالية</button></div>`;
if(k.out==='fail')ctl=`<div class="note">صدّ الحارس المحاولات الثلاث، حاول مرة أخرى.</div><div class="c" style="margin-top:14px"><button class="btn" onclick="S.pk.res=[];S.pk.out=null;R()">حاول مرة أخرى</button></div>`;
a.innerHTML=topbar()+`<div class="card pen c"><h2>تحدي الحارس · المستوى ${k.lv}</h2><p class="sc">سجّل هدفًا واحدًا خلال ثلاث محاولات لتنتقل إلى مرحلة أصعب${k.lv>1?'. الحارس صار أقوى!':'.'}</p>${svg}<p class="dots">${dots}</p>${ctl}</div>`}
function R(){const a=document.getElementById('app');
if(S.scr==='home'){a.innerHTML=`<h1>طبيب القلوب</h1><div class="card c"><p class="sc">القلب يمرض كما يمرض الجسد، وله طبيب يشخّص ويصف العلاج.</p><p>تأتيك حالات من الحياة اليومية على ثلاث مراحل. شخّص الآفة واختر الفضيلة، وسجّل هدفًا على الحارس لتنتقل إلى مرحلة أصعب.</p><p class="mini">اختر فئتك العمرية لتناسبك الحالات</p><div class="ages">${AG.map(g=>`<button class="opt" onclick="start('${g[0]}')">${g[1]}</button>`).join('')}</div></div><div class="heart hb">${heartSvg(50)}</div>`;return}
if(S.scr==='pen'){penR(a);return}
if(S.scr==='play'){const cs=S.cs[S.o[S.i]],val=cs[0]==='v',k=cs[0],d=val?null:D[k],key=S.i+'-'+S.st;
if(!S.opts||(!S.done&&S.fresh!==key)){S.fresh=key;S.t0=Date.now();S.opts=val?sh(cs[3]):S.st===0?sh([d[0],...sh(S.pool.filter(x=>x!==d[0])).slice(0,3)]):sh([d[3],...sh(V.filter(x=>x!==d[3])).slice(0,3)])}
const right=o=>val?o===cs[3][0]:(S.st===0?o===d[0]:o===d[3]);
const q=val?cs[2]:(S.st===0?'ما تشخيص هذه الحالة؟':'ما الفضيلة الوقائية الأنسب؟');
const bs=S.opts.map((o,j)=>{let c='opt';if(S.done){if(right(o))c+=' ok';else if(j===S.sel)c+=' bad'}return `<button class="${c}" ${S.done?'disabled':''} onclick="pick(${j})">${o}</button>`}).join('');
let n='';if(S.done){const exp=val?`الصواب: <b>${cs[3][0]}</b>. ${cs[4]}`:(S.st===0?`<b>${d[0]}</b>: ${(S.dk&&DK[k])||d[1]}.`:`الوقاية الأنسب هنا: <b>${d[3]}</b>.${S.fb?' وتحسّن حال المريض.':''}`);
const last=val||S.st===1,end=S.i+1>=S.cs.length,sg=(S.i+1)%S.sz===0;
n=`<div class="note">${S.fb?'أحسنت! ':'ليست هذه، '}${exp}<br><span class="mini">⏱ زمن إجابتك: ${fmt(S.last)}</span></div><div class="c" style="margin-top:14px"><button class="btn" onclick="next()">${last&&end?'عرض النتيجة':last&&sg?'تحدي الحارس':'التالي'}</button></div>`}
const tag=val?cs[5]:(S.st===0?'الخطوة 1: التشخيص':'الخطوة 2: الوصفة');
const avs=val?av2(cs[6],S.done&&S.fb):av2(k,S.done&&S.st===1&&S.fb);
a.innerHTML=topbar()+`<div class="card"><span class="tag">${tag}</span><div class="case"><div class="av">${avs}</div><p class="sc" style="margin:0">${cs[1]}</p></div><b>${q}</b><div class="opts">${bs}</div>${n}</div>`;return}
const nD=S.cs.filter(c=>c[0]!=='v').length,nV=S.cs.length-nD,p=S.p,tot=S.tms.reduce((x,y)=>x+y,0),avg=tot/Math.max(1,S.tms.length);
const t=p>=85?'طبيب قلوب ماهر':p>=60?'أنت على الطريق الصحيح':'تحتاج إلى مراجعة، حاول مرة أخرى';
a.innerHTML=topbar()+`<div class="card c"><h2>${t}</h2><p class="sc">نقاء قلبك في النهاية: ${Math.round(p)}%</p><p>أصبت في تشخيص ${S.ok} من ${nD} حالات، وفي مواقف بر الوالدين ومساعدة الآخرين ${S.ok2} من ${nV}.</p>${S.miss.length?`<p class="mini">راجع هذه الآفات: ${S.miss.join('، ')}</p>`:'<p class="mini">شخّصت كل الحالات بدقة، أحسنت.</p>'}<p class="mini">⏱ متوسط زمن الإجابة: ${fmt(avg)} · المجموع: ${fmt(tot)}</p></div><div class="card"><b>تذكّر طرق العلاج:</b><ul><li>التحلي بمكارم الأخلاق</li><li>ذكر الله والتضرع بالدعاء والاستغفار</li><li>تدبر القرآن الكريم</li><li>بناء الوعي واليقين، كما تبتعد عن شعلة الشمعة لعلمك أنها تحرق</li></ul></div><div class="c"><button class="btn" onclick="start(S.age)">العب مرة أخرى</button> <button class="btn" style="background:transparent;color:var(--tx);border:2px solid var(--ln)" onclick="S.scr='home';R()">تغيير الفئة</button></div>`}
if(typeof setInterval==='function')setInterval(()=>{const e=document.getElementById('tm');if(e&&S.scr==='play'&&!S.done)e.textContent=fmt(Date.now()-S.t0)},500);
S.scr='home';S.p=50;R();
</script>
